name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qa:
    # SELF-HOSTED, because this repository is private and hosted runners are
    # blocked for the organisation. A job that cannot start reports exactly like
    # a job that ran and failed.
    runs-on: [self-hosted, linux, x64, cbox]
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, curl, openssl, posix
          coverage: none

      - run: composer install --no-interaction --prefer-dist

      - run: vendor/bin/pint --test

      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G

      - run: vendor/bin/pest
