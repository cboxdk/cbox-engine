name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qa:
    # GITHUB-HOSTED, AND THAT IS A SECURITY DECISION RATHER THAN A PREFERENCE.
    # This workflow runs on `pull_request`, and this repository is public — so a
    # self-hosted runner here executes a stranger's branch on our own hardware
    # the moment anybody opens a fork PR. It sat that way from when the
    # repository was private and hosted runners were blocked for the
    # organisation; going public lifted the block and created the hole in the
    # same move, and nobody revisited the line.
    #
    # Hosted runners are free and unlimited for public repositories, so there is
    # nothing to weigh. The private repositories that still need our own fleet
    # are private, which is exactly why fork PRs are not a concern there.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, curl, openssl, posix
          coverage: none

      - run: composer install --no-interaction --prefer-dist

      - run: vendor/bin/pint --test

      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G

      - run: vendor/bin/pest

      - run: composer audit --no-dev

      - run: composer license-check

      # THE COMMITTED SBOM HAS TO MATCH THE LOCK IT DESCRIBES. It is generated
      # deterministically from composer.lock — sorted components, a serial number
      # derived from the content — so it changes only when dependencies do, and a
      # diff here means somebody changed a dependency without regenerating it.
      - run: composer sbom && git diff --exit-code sbom.json
